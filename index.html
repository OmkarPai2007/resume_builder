<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Resume Builder Web App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <i class="fa-solid fa-file-lines"></i>
            <div>
                <h2>Resume Builder</h2>
                <p>Live preview • PDF export</p>
            </div>
        </div>

        <div class="nav-right">

            <div class="template-switch">
                <button class="template-btn active" data-template="classic">
                    Classic
                </button>

                <button class="template-btn" data-template="modern">
                    Modern
                </button>

                <button class="template-btn" data-template="compact">
                    Compact
                </button>
            </div>

            <button id="themeToggle" class="icon-btn">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button id="downloadBtn" class="download-btn">
                <i class="fa-solid fa-download"></i>
                PDF
            </button>

        </div>

    </header>

    <!-- MAIN -->
    <main class="main-container">

        <!-- LEFT FORM -->
        <section class="form-section">

            <!-- PERSONAL -->
            <div class="card">

                <h3>Personal</h3>

                <div class="profile-upload">

                    <div class="profile-preview">
                        <img id="profileImagePreview" src="" alt="">
                        <span id="profilePlaceholder">No photo</span>
                    </div>

                    <label class="upload-btn">
                        <i class="fa-solid fa-upload"></i>
                        Upload
                        <input type="file" id="profileImage" hidden>
                    </label>

                </div>

                <div class="grid-2">

                    <div class="input-group">
                        <label>Full Name *</label>
                        <input type="text" id="fullName" placeholder="Ada Lovelace">
                    </div>

                    <div class="input-group">
                        <label>Title</label>
                        <input type="text" id="jobTitle" placeholder="Software Engineer">
                    </div>

                    <div class="input-group">
                        <label>Email *</label>
                        <input type="email" id="email" placeholder="ada@example.com">
                        <small id="emailError"></small>
                    </div>

                    <div class="input-group">
                        <label>Phone *</label>
                        <input type="text" id="phone" placeholder="+1 555 123 4567">
                        <small id="phoneError"></small>
                    </div>

                </div>

                <div class="input-group">
                    <label>Summary</label>

                    <textarea id="summary" rows="4"
                        placeholder="Write professional summary..."></textarea>
                </div>

            </div>

            <!-- EXPERIENCE -->
            <div class="card">

                <div class="card-header">
                    <h3>Experience</h3>

                    <button id="addExperience" class="small-btn">
                        <i class="fa-solid fa-plus"></i>
                        Add
                    </button>
                </div>

                <div id="experienceContainer"></div>

            </div>

            <!-- EDUCATION -->
            <div class="card">

                <div class="card-header">
                    <h3>Education</h3>

                    <button id="addEducation" class="small-btn">
                        <i class="fa-solid fa-plus"></i>
                        Add
                    </button>
                </div>

                <div id="educationContainer"></div>

            </div>

            <!-- SKILLS -->
            <div class="card">

                <div class="card-header">
                    <h3>Skills</h3>

                    <button id="addSkill" class="small-btn">
                        <i class="fa-solid fa-plus"></i>
                        Add
                    </button>
                </div>

                <div id="skillsContainer"></div>

            </div>

        </section>

        <!-- RIGHT PREVIEW -->
        <section class="preview-section">

            <div id="resumePreview" class="resume classic-template">

                <!-- CLASSIC TEMPLATE -->
                <div class="resume-classic">

                    <div class="resume-header">

                        <img id="previewImage" class="preview-image" src="" alt="">

                        <div>
                            <h1 id="previewName">Your Name</h1>

                            <h2 id="previewTitle">Software Engineer</h2>

                            <p id="previewContact">
                                your@email.com • +91 XXXXX XXXXX
                            </p>
                        </div>

                    </div>

                    <div class="resume-block">
                        <h3>SUMMARY</h3>
                        <p id="previewSummary">
                            Professional summary appears here...
                        </p>
                    </div>

                    <div class="resume-block">
                        <h3>EXPERIENCE</h3>
                        <div id="previewExperience"></div>
                    </div>

                    <div class="resume-block">
                        <h3>EDUCATION</h3>
                        <div id="previewEducation"></div>
                    </div>

                    <div class="resume-block">
                        <h3>SKILLS</h3>
                        <div id="previewSkills"></div>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
